name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Uses the toolchain pinned in rust-toolchain.toml.
          cache-workspaces: ffi
          # Sets RUSTFLAGS, which overrides ffi/.cargo/config.toml, so the
          # bdk_wallet unstable cfg must be repeated here.
          rustflags: "-D warnings --cfg bdk_wallet_unstable"

      - name: Run Rust tests
        working-directory: ffi
        run: cargo test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript typecheck
        run: pnpm typecheck
